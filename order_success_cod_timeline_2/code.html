<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Nature Boutique</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#064c39",
              "primary-light": "#0a6b51",
              "background-light": "#f6f8f7",
              "background-dark": "#10221d",
              "emerald-custom": "#10b981",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        .glass-overlay {
            background: rgba(6, 76, 57, 0.15);
            backdrop-filter: blur(8px);
        }
        .modal-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .input-focus:focus {
            border-color: #064c39;
            ring-color: #064c39;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 font-display min-h-screen flex flex-col relative overflow-hidden">
<div class="fixed inset-0 z-0 opacity-40 pointer-events-none">
<header class="w-full h-20 border-b border-slate-200 flex items-center px-8">
<div class="flex items-center gap-2">
<span class="material-icons text-primary text-3xl">forest</span>
<span class="font-bold text-xl tracking-tight text-primary">Nature Boutique</span>
</div>
</header>
<main class="max-w-5xl mx-auto pt-28 px-8">
<div class="text-center mb-12">
<div class="w-24 h-24 bg-emerald-100 rounded-full mx-auto mb-6"></div>
<div class="h-8 bg-slate-200 w-64 mx-auto rounded"></div>
</div>
<div class="bg-white h-64 rounded-xl mb-8 border border-slate-100"></div>
<div class="grid grid-cols-3 gap-8">
<div class="col-span-2 bg-emerald-50 h-40 rounded-xl"></div>
<div class="bg-white h-40 rounded-xl border border-slate-100"></div>
</div>
</main>
</div>
<div class="fixed inset-0 z-[100] glass-overlay flex items-center justify-center p-4">
<div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl overflow-hidden modal-shadow border border-white/20">
<div class="bg-primary px-8 py-10 text-center relative">
<button class="absolute top-4 right-4 text-white/60 hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-full mb-4">
<span class="material-icons text-white text-3xl">forest</span>
</div>
<h2 class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
<p class="text-emerald-100/80 text-sm">Sign in to your Nature Boutique account</p>
</div>
<div class="px-8 py-8">
<form action="#" class="space-y-5">
<div>
<label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5 ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="email" placeholder="nature@boutique.com" required="" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-1.5 ml-1">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-500" for="password">Password</label>
<a class="text-xs font-bold text-emerald-custom hover:text-emerald-600 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full py-3.5 bg-primary hover:bg-primary-light text-white font-bold rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-[0.98]" type="submit">
                        Sign In
                    </button>
</form>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-slate-900 px-4 text-slate-400 font-medium">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5qNGuvOgINWfjPxJVU03eZg59HfX4Qxky0q7uqnjT1GsWwaZ7lQ1XwZK7-hvK_q3C_URCtbEk6M5-FGQqNwPedXX9ygFr-yjGgVc-ssDwNQqXJlTQUzy3GZ3jkSg1zlAZ9Awhxo2zhimePTWKePzLlDqhCeVhY3ynmCIp2HegaAV3uU6STRXmNhocO9ourEulohNgVMfyCIVL6h0iwUEUoQ6JdQjbrXlYy_ueBVy80M0-wKM0mLV7l1kyOf7YqvYuaYGR9oZgKVg"/>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Google</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Apple" class="w-5 h-5 dark:invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnInZbH45dNGa8Va7H00-4cbxVpOoNX0d57pmESOsJ8txeP13hCQjDLFfBCYt1DTcoQrbypE9uM2jCz3IP3giuj6RZGJ-hiY1zJlLccpeM645BTi8Lcpnby6Ukoo_qmbyzrroCpu3-vFhjnydwWmxhf8gzy_z_NnWKHk0LTMZzd5mAt8Mjt8yFK_HGLy97BOhXt4PVjTQnh85KiQpHp8IKPIizYtRqhzBFKImBu0BY1DLlEvKetKSv7-5WulFQvCRh7h_tRKsUyng"/>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Apple</span>
</button>
</div>
</div>
<div class="px-8 py-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 text-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                    Don't have an account? 
                    <a class="text-primary dark:text-emerald-400 font-bold hover:underline" href="#">Register Now</a>
</p>
</div>
</div>
</div>

</body></html>
